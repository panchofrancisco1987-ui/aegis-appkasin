name: .NET CI/CD
on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]
jobs:
  build-and-test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:15-alpine
        env:
          POSTGRES_USER: aegis_test
          POSTGRES_PASSWORD: aegis_test_pass
          POSTGRES_DB: aegis_test_db
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 5432:5432
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'
      - run: dotnet restore Aegis.Governance.sln
      - run: dotnet build Aegis.Governance.sln --no-restore --configuration Release
      - env:
          ConnectionStrings__Default: "Host=localhost;Database=aegis_test_db;Username=aegis_test;Password=aegis_test_pass"
        run: dotnet test Aegis.Governance.sln --no-build --verbosity normal
      - if: github.ref == 'refs/heads/main'
        run: dotnet publish src/Aegis.Governance.Api/Aegis.Governance.Api.csproj -c Release -o ./publish
      - if: github.ref == 'refs/heads/main'
        uses: actions/upload-artifact@v4
        with:
          name: aegis-api
          path: ./publish
